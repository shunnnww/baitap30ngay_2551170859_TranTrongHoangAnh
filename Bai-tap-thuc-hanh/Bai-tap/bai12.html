<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>

    <div class="khung-chinh">
        <!-- Ô HIỂN THỊ TỜ LỊCH -->
        <div class="o-lich">
            <div id="hien-thi-nam" class="nam-lich">2026</div>
            <div id="hien-thi-thang" class="thang-lich">Tháng 12</div>
            <div id="hien-thi-ngay" class="ngay-lich">24</div>
            <div id="hien-thi-thu" class="thu-lich">Thứ hai</div>
        </div>

        <!-- LỜI CHÀO THEO BUỔI -->
        <div id="loi-chao" class="loi-chao">Chào buổi sáng!</div>

        <!-- FORM NHẬP NGÀY / THÁNG / NĂM -->
        <div class="khung-nhap-lieu">
            <div class="nhom-nhap">
                <label for="nhap-ngay">Ngày</label>
                <input type="number" id="nhap-ngay" min="1" max="31" value="24">
            </div>

            <div class="nhom-nhap">
                <label for="nhap-thang">Tháng</label>
                <input type="number" id="nhap-thang" min="1" max="12" value="12">
            </div>

            <div class="nhom-nhap">
                <label for="nhap-nam">Năm</label>
                <input type="number" id="nhap-nam" min="1900" max="2100" value="2026">
            </div>

            <button type="button" id="btn-in-lich" class="nut-in-lich">In<br>lịch</button>
        </div>
    </div>

    <script src="bai12.js"></script>
</body>
</html>
