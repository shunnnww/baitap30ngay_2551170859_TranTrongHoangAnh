<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký với Bootstrap</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                <!-- THẺ FORM NỀN #FFFFFF, BÓNG ĐỔ, BO GÓC -->
                <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
                    <!-- TIÊU ĐỀ THẺ NỀN #198754 (BG-SUCCESS), CHỮ TRẮNG, CĂN GIỮA -->
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
                    </div>

                    <div class="card-body p-4">
                        <form class="row g-3">
                            <!-- HỌ VÀ TÊN & MÃ SINH VIÊN -->
                            <div class="col-md-6">
                                <label for="ho-ten" class="form-label small fw-semibold">Họ và tên</label>
                                <input type="text" class="form-control" id="ho-ten" placeholder="Nguyễn Văn A" required>
                            </div>

                            <div class="col-md-6">
                                <label for="ma-sv" class="form-label small fw-semibold">Mã sinh viên</label>
                                <input type="text" class="form-control" id="ma-sv" placeholder="22xxxxxx" required>
                            </div>

                            <!-- EMAIL & SỐ ĐIỆN THOẠI -->
                            <div class="col-md-6">
                                <label for="email" class="form-label small fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                            </div>

                            <div class="col-md-6">
                                <label for="sdt" class="form-label small fw-semibold">Số điện thoại</label>
                                <input type="tel" class="form-control" id="sdt" placeholder="09xxxxxxxx" required>
                            </div>

                            <!-- TRÌNH ĐỘ (RADIO INLINE) -->
                            <div class="col-12">
                                <label class="form-label small fw-semibold d-block mb-2">Trình độ</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="tdCoBan" value="Cơ bản" checked>
                                    <label class="form-check-label small" for="tdCoBan">Cơ bản</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="tdKha" value="Khá">
                                    <label class="form-check-label small" for="tdKha">Khá</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="trinhDo" id="tdTot" value="Tốt">
                                    <label class="form-check-label small" for="tdTot">Tốt</label>
                                </div>
                            </div>

                            <!-- CHỌN LỚP (SELECT) -->
                            <div class="col-12">
                                <label for="chon-lop" class="form-label small fw-semibold">Chọn lớp</label>
                                <select class="form-select" id="chon-lop">
                                    <option value="67CNTT1" selected>67CNTT1</option>
                                    <option value="67CNTT2">67CNTT2</option>
                                    <option value="67KTPM1">67KTPM1</option>
                                    <option value="67HTTT">67HTTT</option>
                                </select>
                            </div>

                            <!-- CHECKBOX CAM KẾT -->
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="cam-ket" checked required>
                                    <label class="form-check-label small text-dark" for="cam-ket">
                                        Tôi cam kết tự làm bài và quay video OBS
                                    </label>
                                </div>
                            </div>

                            <!-- NÚT NHẬP LẠI VÀ ĐĂNG KÝ -->
                            <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                                <button type="submit" class="btn btn-success px-4 fw-semibold">Đăng ký</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
