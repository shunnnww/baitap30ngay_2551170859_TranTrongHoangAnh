<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 12 - In lịch</title>
    <link rel="stylesheet" href="bai12.css">
</head>
<body>
    <div class="khung-chinh">
        <div class="o-lich">
            <div id="hien-thi-nam" class="nam-lich">2026</div>
            <div id="hien-thi-thang" class="thang-lich">Tháng 12</div>
            <div id="hien-thi-ngay" class="ngay-lich">24</div>
            <div id="hien-thi-thu" class="thu-lich">Thứ hai</div>
        </div>

        <div id="loi-chao" class="loi-chao">Chào buổi sáng!</div>

        <div class="khung-nhap-lieu">
            <div class="nhom-nhap">
                <label for="ngay-nhap">Ngày</label>
                <input type="number" id="ngay-nhap" min="1" max="31" value="24">
            </div>
            <div class="nhom-nhap">
                <label for="thang-nhap">Tháng</label>
                <input type="number" id="thang-nhap" min="1" max="12" value="12">
            </div>
            <div class="nhom-nhap">
                <label for="nam-nhap">Năm</label>
                <input type="number" id="nam-nhap" min="1900" max="2100" value="2026">
                
                <button type="button" id="btn-in-lich" class="nut-in-lich">In</button>
        </div>
    </div>
    <script src="bai12test.js"></script>
</body>
</html>
