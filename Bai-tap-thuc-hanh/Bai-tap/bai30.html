<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 — Bảng điều khiển (Bootstrap)</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 230px;
            background-color: #212529;
            min-height: 100vh;
            flex-shrink: 0;
        }
        .sidebar-brand {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            padding: 20px 20px 15px 20px;
        }
        .sidebar .nav-link {
            color: #9ca3af;
            font-size: 13.5px;
            padding: 8px 16px;
            margin: 2px 10px;
            border-radius: 6px;
        }
        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: #ffffff;
            font-weight: 500;
        }
        .the-thong-ke {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .the-thong-ke .nhan-tk {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .the-thong-ke .so-tk {
            font-size: 24px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }
        .khung-tien-do-chuong {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        .list-group-item {
            font-size: 13px;
            padding: 12px 18px;
            border-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex min-vh-100">
        <!-- 1. SIDEBAR MENU DỌC NỀN #212529, RỘNG 230px -->
        <aside class="sidebar">
            <div class="sidebar-brand">CSE.TLU Admin</div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a href="#" class="nav-link active">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Điểm số</a>
                </li>
            </ul>
        </aside>

        <!-- 2. KHUNG NỘI DUNG CHÍNH -->
        <main class="flex-grow-1 p-4">
            <!-- THANH TIÊU ĐỀ NỘI DUNG -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-dark mb-0">Bảng điều khiển</h4>
                <div class="d-flex gap-2 align-items-center">
                    <span class="badge bg-warning text-dark px-3 py-2 fw-semibold">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3" type="button">Xuất báo cáo</button>
                </div>
            </div>

            <!-- 4 THẺ THỐNG KÊ (COL-MD-3, BÓNG ĐỔ, BORDER-0) -->
            <div class="row g-3 mb-4">
                <!-- THẺ 1: SINH VIÊN -->
                <div class="col-sm-6 col-md-3">
                    <div class="the-thong-ke">
                        <div class="nhan-tk">Sinh viên</div>
                        <div class="so-tk">128</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-primary" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>

                <!-- THẺ 2: ĐÃ NỘP -->
                <div class="col-sm-6 col-md-3">
                    <div class="the-thong-ke">
                        <div class="nhan-tk">Đã nộp</div>
                        <div class="so-tk">96</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-success" style="width: 75%;"></div>
                        </div>
                    </div>
                </div>

                <!-- THẺ 3: CHƯA NỘP -->
                <div class="col-sm-6 col-md-3">
                    <div class="the-thong-ke">
                        <div class="nhan-tk">Chưa nộp</div>
                        <div class="so-tk">32</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-danger" style="width: 25%;"></div>
                        </div>
                    </div>
                </div>

                <!-- THẺ 4: ĐIỂM TB -->
                <div class="col-sm-6 col-md-3">
                    <div class="the-thong-ke">
                        <div class="nhan-tk">Điểm TB</div>
                        <div class="so-tk">7.8</div>
                        <div class="progress" style="height: 4px;">
                            <div class="progress-bar bg-warning" style="width: 78%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TIẾN ĐỘ THEO CHƯƠNG -->
            <div class="khung-tien-do-chuong">
                <div class="p-3 border-bottom bg-white">
                    <span class="fw-bold small text-dark">Tiến độ theo chương</span>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 1 — HTML5</span>
                        <span class="badge bg-success rounded-pill px-2 py-1">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 2 — JavaScript</span>
                        <span class="badge bg-primary rounded-pill px-2 py-1">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 3 — CSS3</span>
                        <span class="badge bg-info text-dark rounded-pill px-2 py-1">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary rounded-pill px-2 py-1">45%</span>
                    </li>
                </ul>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
