<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 21 - Bố cục trang 4 vùng</title>
    <link rel="stylesheet" href="bai21.css">
</head>
<body>

    <div class="trang-chinh">
        <!-- VÙNG 1: BANNER TRÊN CÙNG -->
        <header class="banner-tren">
            <img src="LogoTT.gif" alt="Logo" class="logo">
            <span class="chu-banner">Hệ thống bài tập Lập trình Web</span>
        </header>

        <!-- KHUNG 3 CỘT: MENU TRÁI - NỘI DUNG GIỮA - QUẢNG CÁO PHẢI -->
        <div class="than-3-cot">
            <!-- VÙNG 2: MENU DỌC BÊN TRÁI -->
            <nav class="menu-trai">
                <a href="#" class="muc-menu active">Ngôn ngữ HTML</a>
                <a href="#" class="muc-menu">Ngôn ngữ JavaScript</a>
                <a href="#" class="muc-menu">Các đối tượng trong JavaScript</a>
                <a href="#" class="muc-menu">CSS và bố cục hiện đại</a>
            </nav>

            <!-- VÙNG 3: NỘI DUNG CHÍNH Ở GIỮA -->
            <main class="noi-dung-giua">
                <h3 class="tieu-de-noi-dung">Bài tập HTML cơ bản</h3>

                <!-- HỘP VÀNG MENU CON -->
                <div class="hop-vang">
                    <span>&bull; Đảo chuỗi</span>
                    <span>&bull; Phân tích chuỗi</span>
                    <span>&bull; Tìm và thay thế</span>
                </div>

                <!-- KHUNG NỘI DUNG TRẮNG CÓ VIỀN -->
                <div class="khung-trang-noi-dung">
                    <p class="dong-mo-dau">Thiết kế trang web có nội dung như sau:</p>
                    <div class="noi-dung-trung-tam">
                        <p class="ten-tt">Trung Tâm Tin học – ĐH KHTN</p>
                        <p class="chao-mung">Chào mừng các bạn đến với ngôn ngữ HTML</p>
                    </div>
                </div>
            </main>

            <!-- VÙNG 4: CỘT QUẢNG CÁO BÊN PHẢI -->
            <aside class="cot-quang-cao">
                <a href="#" class="item-qc">
                    <img src="Qcao01.gif" alt="Quảng cáo 1" class="anh-qc">
                </a>
                <a href="#" class="item-qc">
                    <img src="Qcao02.gif" alt="Quảng cáo 2" class="anh-qc">
                </a>
            </aside>
        </div>
    </div>

</body>
</html>
