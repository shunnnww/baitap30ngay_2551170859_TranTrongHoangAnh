<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 - Thư viện ảnh</title>
    <link rel="stylesheet" href="bai11test.css">
</head>
<body>
    <div class="khung-thu-vien">
        <header class="dau-thu-vien">
            <h1 class="tieu-de-thu-vien">Thư viện ảnh Việt Nam </h1>
            <p class="mo-ta-thu-vien">Bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figue/figcaption</p>
        </header>

        <main class="luoi-anh">
            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/4-fansipan.jpg" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>

            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure class="the-anh">
                <img src="../Kho-anh/Bai11/6-phong-nha.jpg" alt="Động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </main>
    </div>
</body>
</html>
