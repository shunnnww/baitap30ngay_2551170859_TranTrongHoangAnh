<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20 - Hiệu ứng ảnh với CSS Filter</title>
    <link rel="stylesheet" href="bai20.css">
</head>
<body>

    <div class="khung-chinh">
        <!-- KHUNG ẢNH NỀN #1c2226 -->
        <div class="hop-anh">
            <img src="hoahong.gif" alt="Hoa hồng" id="anh-hoa" class="anh-hoa filter-gray">
            <div class="chu-special">Special For You</div>
        </div>

        <!-- THANH NÚT BẤM (2 HÀNG THEO HÌNH MINH HỌA) -->
        <div class="cac-hang-nut">
            <div class="hang-nut">
                <button type="button" class="btn-filter active" data-filter="gray">Gray</button>
                <button type="button" class="btn-filter" data-filter="xray">Xray</button>
                <button type="button" class="btn-filter" data-filter="invert">Invert</button>
                <button type="button" class="btn-filter" data-filter="fliph">FlipH</button>
                <button type="button" class="btn-filter" data-filter="flipv">FlipV</button>
                <button type="button" class="btn-filter" data-filter="glow">Glow</button>
                <button type="button" class="btn-filter" data-filter="shadow">Shadow</button>
                <button type="button" class="btn-filter" data-filter="boldshadow">Bold Shadow</button>
            </div>
            <div class="hang-nut">
                <button type="button" class="btn-filter" data-filter="dropshadow">DropShadow</button>
                <button type="button" class="btn-filter" data-filter="blur">Blur</button>
                <button type="button" class="btn-filter" data-filter="wave">Wave</button>
                <button type="button" class="btn-filter" data-filter="mask">Mask</button>
                <button type="button" class="btn-filter" data-filter="alpha">Alpha</button>
            </div>
        </div>
    </div>

    <!-- SVG FILTER CHO WAVE -->
    <svg style="display: none;">
        <filter id="wave">
            <feTurbulence type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="1" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" />
        </filter>
    </svg>

    <script src="bai20.js"></script>
</body>
</html>
