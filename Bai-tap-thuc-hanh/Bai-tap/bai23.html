<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh hiệu ứng Hover</title>
    <link rel="stylesheet" href="bai23.css">
</head>
<body>

    <div class="khung-chinh">
        <!-- TIÊU ĐỀ TRANG -->
        <header class="phan-tieu-de">
            <h2 class="tieu-de-chinh">Thư viện ảnh — Hiệu ứng Hover</h2>
            <p class="mo-ta-phu">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <!-- LƯỚI 6 ẢNH CSS GRID 3 CỘT -->
        <main class="luoi-anh">
            <div class="o-anh">
                <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" class="anh-danh-thang">
                <div class="lop-phu-ten">Vịnh Hạ Long</div>
            </div>

            <div class="o-anh">
                <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng" class="anh-danh-thang">
                <div class="lop-phu-ten">Hang Sơn Đoòng</div>
            </div>

            <div class="o-anh">
                <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" class="anh-danh-thang">
                <div class="lop-phu-ten">Thác Bản Giốc</div>
            </div>

            <div class="o-anh">
                <img src="4-fansipan.jpg" alt="Fansipan" class="anh-danh-thang">
                <div class="lop-phu-ten">Fansipan</div>
            </div>

            <div class="o-anh">
                <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long" class="anh-danh-thang">
                <div class="lop-phu-ten">Đồng bằng sông Cửu Long</div>
            </div>

            <div class="o-anh">
                <img src="6-phong-nha.jpg" alt="Động Phong Nha" class="anh-danh-thang">
                <div class="lop-phu-ten">Động Phong Nha</div>
            </div>
        </main>
    </div>

</body>
</html>
